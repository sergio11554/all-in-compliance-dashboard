services:
  clamav:
    image: clamav/clamav:1.4.3
    platform: ${SFM_CLAMAV_PLATFORM:-linux/amd64}
    profiles: ["malware"]
    restart: unless-stopped
    volumes:
      - sfm-compliance-clamav:/var/lib/clamav

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: ["s3"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sfm-storage-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-before-production-storage}
    ports:
      - "${SFM_MINIO_PORT:-9000}:9000"
      - "${SFM_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - sfm-compliance-objects:/data

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sfm_compliance}
      POSTGRES_USER: ${POSTGRES_USER:-sfm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-before-production}
    volumes:
      - sfm-compliance-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sfm} -d ${POSTGRES_DB:-sfm_compliance}"]
      interval: 5s
      timeout: 5s
      retries: 12

  sfm-compliance:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      ISMS_HOST: 0.0.0.0
      ISMS_PORT: 5173
      ISMS_DATA_DIR: /data
      ISMS_STATIC_BASE: /app/frontend
      ISMS_PUBLIC_URL: ${ISMS_PUBLIC_URL:-http://127.0.0.1:${SFM_HTTP_PORT:-5173}}
      ISMS_COOKIE_SECURE: ${ISMS_COOKIE_SECURE:-0}
      ISMS_COOKIE_SAMESITE: ${ISMS_COOKIE_SAMESITE:-Lax}
      ISMS_HSTS: ${ISMS_HSTS:-0}
      ISMS_SESSION_SECONDS: ${ISMS_SESSION_SECONDS:-28800}
      ISMS_MFA_ENFORCEMENT: ${ISMS_MFA_ENFORCEMENT:-off}
      ISMS_MFA_REQUIRED_ROLES: ${ISMS_MFA_REQUIRED_ROLES:-admin,consultant,manager}
      ISMS_LOGIN_ACCOUNT_MAX_ATTEMPTS: ${ISMS_LOGIN_ACCOUNT_MAX_ATTEMPTS:-8}
      ISMS_LOGIN_IP_MAX_ATTEMPTS: ${ISMS_LOGIN_IP_MAX_ATTEMPTS:-30}
      ISMS_LOGIN_ATTEMPT_WINDOW_SECONDS: ${ISMS_LOGIN_ATTEMPT_WINDOW_SECONDS:-900}
      ISMS_LOGIN_LOCK_SECONDS: ${ISMS_LOGIN_LOCK_SECONDS:-900}
      ISMS_PASSWORD_MIN_LENGTH: ${ISMS_PASSWORD_MIN_LENGTH:-12}
      ISMS_PASSWORD_MAX_LENGTH: ${ISMS_PASSWORD_MAX_LENGTH:-256}
      ISMS_PASSWORD_HISTORY_COUNT: ${ISMS_PASSWORD_HISTORY_COUNT:-5}
      ISMS_ACCOUNT_RECOVERY_ENABLED: ${ISMS_ACCOUNT_RECOVERY_ENABLED:-0}
      ISMS_ACCOUNT_RECOVERY_TOKEN_SECONDS: ${ISMS_ACCOUNT_RECOVERY_TOKEN_SECONDS:-3600}
      ISMS_INVITATION_EMAIL_ENABLED: ${ISMS_INVITATION_EMAIL_ENABLED:-0}
      ISMS_MAX_JSON_BYTES: ${ISMS_MAX_JSON_BYTES:-8388608}
      ISMS_MAX_UPLOAD_BYTES: ${ISMS_MAX_UPLOAD_BYTES:-41943040}
      ISMS_MAX_TENANT_EXPORT_BYTES: ${ISMS_MAX_TENANT_EXPORT_BYTES:-268435456}
      ISMS_WORKSPACE_SNAPSHOT_LIMIT: ${ISMS_WORKSPACE_SNAPSHOT_LIMIT:-50}
      ISMS_EVENT_STREAM_SECONDS: ${ISMS_EVENT_STREAM_SECONDS:-55}
      ISMS_EVENT_HEARTBEAT_SECONDS: ${ISMS_EVENT_HEARTBEAT_SECONDS:-15}
      ISMS_EVENT_RETENTION_DAYS: ${ISMS_EVENT_RETENTION_DAYS:-7}
      ISMS_OPERATIONS_MONITOR_ENABLED: ${ISMS_OPERATIONS_MONITOR_ENABLED:-1}
      ISMS_OPERATIONS_MONITOR_SECONDS: ${ISMS_OPERATIONS_MONITOR_SECONDS:-300}
      ISMS_JOB_WORKER_ENABLED: ${ISMS_JOB_WORKER_ENABLED:-1}
      ISMS_JOB_WORKER_SECONDS: ${ISMS_JOB_WORKER_SECONDS:-15}
      ISMS_JOB_MAX_ATTEMPTS: ${ISMS_JOB_MAX_ATTEMPTS:-3}
      ISMS_NOTIFICATION_DELIVERY_ENABLED: ${ISMS_NOTIFICATION_DELIVERY_ENABLED:-0}
      ISMS_NOTIFICATION_DELIVERY_SECONDS: ${ISMS_NOTIFICATION_DELIVERY_SECONDS:-30}
      ISMS_NOTIFICATION_MAX_ATTEMPTS: ${ISMS_NOTIFICATION_MAX_ATTEMPTS:-5}
      ISMS_NOTIFICATION_WEBHOOK_URL: ${ISMS_NOTIFICATION_WEBHOOK_URL:-}
      ISMS_NOTIFICATION_WEBHOOK_SECRET: ${ISMS_NOTIFICATION_WEBHOOK_SECRET:-}
      ISMS_NOTIFICATION_SMTP_HOST: ${ISMS_NOTIFICATION_SMTP_HOST:-}
      ISMS_NOTIFICATION_SMTP_PORT: ${ISMS_NOTIFICATION_SMTP_PORT:-587}
      ISMS_NOTIFICATION_SMTP_USER: ${ISMS_NOTIFICATION_SMTP_USER:-}
      ISMS_NOTIFICATION_SMTP_PASSWORD: ${ISMS_NOTIFICATION_SMTP_PASSWORD:-}
      ISMS_NOTIFICATION_SMTP_FROM: ${ISMS_NOTIFICATION_SMTP_FROM:-}
      ISMS_NOTIFICATION_SMTP_TO: ${ISMS_NOTIFICATION_SMTP_TO:-}
      ISMS_NOTIFICATION_SMTP_TLS: ${ISMS_NOTIFICATION_SMTP_TLS:-1}
      ISMS_ADMIN_PASSWORD: ${ISMS_ADMIN_PASSWORD:-}
      ISMS_FILE_KEY: ${ISMS_FILE_KEY:-}
      ISMS_STORAGE_BACKEND: ${ISMS_STORAGE_BACKEND:-local}
      ISMS_S3_ENDPOINT: ${ISMS_S3_ENDPOINT:-}
      ISMS_S3_BUCKET: ${ISMS_S3_BUCKET:-}
      ISMS_S3_PREFIX: ${ISMS_S3_PREFIX:-uploads}
      ISMS_S3_REGION: ${ISMS_S3_REGION:-eu-central-1}
      ISMS_S3_ACCESS_KEY: ${ISMS_S3_ACCESS_KEY:-}
      ISMS_S3_SECRET_KEY: ${ISMS_S3_SECRET_KEY:-}
      ISMS_S3_ADDRESSING_STYLE: ${ISMS_S3_ADDRESSING_STYLE:-path}
      ISMS_S3_AUTO_CREATE_BUCKET: ${ISMS_S3_AUTO_CREATE_BUCKET:-0}
      ISMS_OIDC_PROVIDERS_JSON: ${ISMS_OIDC_PROVIDERS_JSON:-}
      ISMS_OIDC_STATE_SECONDS: ${ISMS_OIDC_STATE_SECONDS:-600}
      ISMS_OIDC_ALLOW_INSECURE: ${ISMS_OIDC_ALLOW_INSECURE:-0}
      ISMS_MALWARE_SCAN_MODE: ${ISMS_MALWARE_SCAN_MODE:-disabled}
      ISMS_MALWARE_SCAN_REQUIRED: ${ISMS_MALWARE_SCAN_REQUIRED:-0}
      ISMS_CLAMAV_HOST: ${ISMS_CLAMAV_HOST:-clamav}
      ISMS_CLAMAV_PORT: ${ISMS_CLAMAV_PORT:-3310}
      ISMS_CLAMAV_TIMEOUT_SECONDS: ${ISMS_CLAMAV_TIMEOUT_SECONDS:-15}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-sfm}:${POSTGRES_PASSWORD:-change-me-before-production}@postgres:5432/${POSTGRES_DB:-sfm_compliance}}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${SFM_HTTP_PORT:-5173}:5173"
    volumes:
      - sfm-compliance-data:/data
      - "${SFM_FRONTEND_DIR:-./frontend-current}:/app/frontend:ro"
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:5173/api/health', timeout=3)); raise SystemExit(0 if data.get('ok') else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  sfm-compliance-data:
  sfm-compliance-postgres:
  sfm-compliance-objects:
  sfm-compliance-clamav:
